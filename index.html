
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snack Dealer</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="login.js"></script>
</head>
<body>
  <header>
    <h1>🍟 SNACK DEALER</h1>
    <p>Your snacks. Your choice.</p>
  </header>

  <main>
    <section id="login-section" class="cart" hidden>
      <h2>Welcome to Snack Dealer!</h2>
      <p>Sign in or register to view our products.</p>

      <form id="login-form">
        <input id="email" type="email"
               placeholder="Email" required>

        <input id="password" type="password"
               placeholder="Password (at least 6 characters)"
               minlength="6" required>

        <button type="submit">Sign In</button>
        <button type="button" id="register-btn">
          Register
        </button>
      </form>

      <p id="login-message"></p>
    </section>

    <section id="store-section" hidden>
      
<a href="admin.html" id="admin-link" hidden>
  <span class="admin-icon">🛡️</span>
  <span>Admin Dashboard</span>
  <span class="admin-arrow">→</span>
</a>

        <button id="logout-btn">Log Out</button>

      <h2>Our Products</h2>
      <div id="products" class="products"></div>

      <section class="cart">
        <h2>🛒 Your Cart</h2>
        <div id="cart-items"></div>
        <h3 id="total">Total: 0đ</h3>

        <input id="customer" type="text"
               placeholder="Your nickname"
               maxlength="40">

        <button id="order-button">Place Order</button>
        <p id="status"></p>
      </section>
    </section>
  </main>

  <footer>© Snack Dealer Company</footer>
</body>
</html>
